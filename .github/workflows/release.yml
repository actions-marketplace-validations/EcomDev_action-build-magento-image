name: Release Please
on:
  push:
    branches:
      - main

jobs:
  verify-release:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci.yml

  release-please:
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: googleapis/release-please-action@v5